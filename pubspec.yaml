name: pizza
description: "Pizzaria Delivery App - Sistema de pedidos para entrega"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Network
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.3.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.3.3
  get_it: ^8.0.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8
  json_serializable: ^6.8.0
  freezed: ^2.5.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.0

flutter:
  uses-material-design: true